name: expensiv
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  app_settings: ^9.0.0
  audio_service: ^0.18.19
  audioplayers: ^6.8.1
  connectivity_plus: ^7.3.1
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  flutter_gen: ^5.15.0
  flutter_svg: ^2.3.0
  get_storage: ^2.1.1
  google_fonts: ^8.2.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  liquid_glass_easy: ^4.3.1
  lottie: ^3.5.1
  open_file: ^4.0.0
  path: ^1.9.1
  permission_handler: ^13.0.2
  provider: ^6.1.5+1
  rxdart: ^0.28.0
  share_plus: ^13.3.0
  sqflite: ^2.4.3
  url_launcher: ^6.3.2
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.15.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/
    - assets/lottie/

  fonts:
    - family: inter
      fonts:
        - asset: assets/fonts/inter.ttf